<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raafat Nagy | AI Engineer</title>
    <meta
      name="description"
      content="Portfolio of Raafat Nagy — AI Engineer building practical, end-to-end AI systems across Computer Vision, NLP / RAG, Deep Learning, Machine Learning, and Time-Series Forecasting."
    />
    <meta name="author" content="Raafat Nagy" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Raafat Nagy | AI Engineer" />
    <meta
      property="og:description"
      content="AI Engineer building practical, end-to-end AI systems: Computer Vision, NLP / RAG, Deep Learning, Machine Learning and Time-Series Forecasting."
    />
    <meta property="og:url" content="https://raafat-nagy.github.io/" />
    <meta property="og:image" content="https://raafat-nagy.github.io/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://raafat-nagy.github.io/" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Fonts (progressive enhancement — the site works fine without them) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warms up the connection for YouTube demo thumbnails -->
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization: dark by default, restores the saved preference -->
    <script>
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : true;
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
